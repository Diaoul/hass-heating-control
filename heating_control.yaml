blueprint:
  name: 🔥 Heating Control
  description: |
    Intelligent heating control based on presence, schedules, and conditions.

    **Features:**
    - 🌡️ Temperature control with comfort/eco/away modes
    - ⚡ Boost temperature offset for scheduled periods
    - 👥 Presence detection
    - 📅 Schedule integration for comfort periods
    - 🪟 Window/door detection
    - ❄️ Automatic frost protection
    - 🎭 Guest mode
    - 🎯 Optional preset mode support
    - ⏱️ Configurable durations for all state changes
    - 🖐️ Manual thermostat changes held for a while instead of put back
    - 📊 Optional status helper reporting the applied mode

    **Automatic frost protection needs a date-and-time helper, and person
    entities or guest mode.** Without the helper, or with no presence input to
    tell it the house is empty, only the manual frost protection override
    works.
  domain: automation
  source_url: https://github.com/Diaoul/hass-heating-control/blob/main/heating_control.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    thermostats_and_temperatures:
      name: Thermostats & Temperatures
      icon: mdi:thermometer
      collapsed: false
      input:
        climate_target:
          name: Climate Entities
          description: The climate/thermostat entities to control
          selector:
            entity:
              filter:
                - domain: climate
              multiple: true

        climate_available_duration:
          name: ⏱️ Climate Available Duration
          description: >-
            How long a climate entity must stay available before the automation
            reacts to it returning. A cloud integration that is being
            rate-limited flaps between available and unavailable, sometimes for
            only a fraction of a second at a time; without this delay every blip
            starts a run that re-sends the commands that caused the rate limit
            in the first place. Set it to 0 to react immediately.
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
              enable_day: false

        comfort_temperature:
          name: 🛋️ Comfort Temperature
          description: Target temperature when home and schedule is active
          default: 21
          selector:
            number:
              min: 15
              max: 30
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        eco_temperature:
          name: 🍃 Eco Temperature
          description: Target temperature when home but schedule is inactive
          default: 18
          selector:
            number:
              min: 10
              max: 25
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        boost_temperature_offset:
          name: ⚡ Boost Temperature Offset
          description: Temperature boost to add to comfort temperature during boost periods (e.g., +2°C = comfort 21°C becomes 23°C)
          default: 1
          selector:
            number:
              min: 0
              max: 5
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        away_temperature_offset:
          name: 🚶 Away Temperature Offset
          description: Temperature offset from comfort when presence is not detected (0 = use eco temperature, -5 = comfort minus 5°C)
          default: -1
          selector:
            number:
              min: -5
              max: 0
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

        frost_protection_temperature:
          name: ❄️ Frost Protection Temperature
          description: Target temperature during frost protection mode
          default: 12
          selector:
            number:
              min: 5
              max: 15
              step: 0.5
              unit_of_measurement: "°C"
              mode: slider

    preset_modes:
      name: Preset Modes
      icon: mdi:target
      collapsed: true
      input:
        use_preset_modes:
          name: 🎚️ Use Preset Modes
          description: Enable to set preset modes on climate entities. Disable to only control temperature setpoints and HVAC mode.
          default: false
          selector:
            boolean:

        comfort_preset:
          name: 🛋️ Comfort Preset Mode
          description: Preset mode to use for comfort temperature
          default: "comfort"
          selector:
            text:

        eco_preset:
          name: 🍃 Eco Preset Mode
          description: Preset mode to use for eco temperature
          default: "eco"
          selector:
            text:

        boost_preset:
          name: ⚡ Boost Preset Mode
          description: Preset mode to use for boost mode
          default: "comfort"
          selector:
            text:

        away_preset:
          name: 🚶 Away Preset Mode
          description: Preset mode to use for away mode
          default: "comfort_1"
          selector:
            text:

        frost_protection_preset:
          name: ❄️ Frost Protection Preset Mode
          description: Preset mode to use for frost protection
          default: "frost_protection"
          selector:
            text:

    schedule:
      name: Schedule
      icon: mdi:calendar-clock
      collapsed: true
      input:
        schedule_entity:
          name: 📅 Schedule Entity
          description: |
            Schedule entity that defines when comfort temperature should be active.

            Create your schedule [here](https://my.home-assistant.io/redirect/helpers/).
          default: []
          selector:
            entity:
              filter:
                - domain: schedule
              multiple: false

    presence_detection:
      name: Presence Detection
      icon: mdi:account-multiple
      collapsed: true
      input:
        presence_persons:
          name: 👤 Person Entities
          description: Person entities to track for presence (someone home = at least one person home)
          default: []
          selector:
            entity:
              filter:
                - domain: person
              multiple: true

        guest_mode:
          name: 🎭 Guest Mode
          description: Toggle that acts like an additional person entity (when on = someone home, combined with other presence detection)
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - switch
                    - binary_sensor
              multiple: false

        presence_sensor:
          name: 📍 Presence Sensor
          description: Binary sensor for room/area presence detection (combines with person entities using AND logic when both configured)
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: false

        person_away_duration:
          name: ⏱️ Person Away Duration
          description: Duration for which everyone must be away before considering them away
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:
              enable_day: false

        person_home_duration:
          name: ⏱️ Person Home Duration
          description: Duration for which someone must be home before considering them home
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
              enable_day: false

    boost:
      name: Boost Temperature
      icon: mdi:flash
      collapsed: true
      input:
        boost_schedule_entity:
          name: ⚡ Boost Schedule/Sensor
          description: |
            Schedule or binary sensor that defines when boost temperature offset should be active.

            Boost only applies during comfort mode. When this schedule/sensor is ON and comfort temperature is active,
            the boost offset will be added to the comfort temperature.

            Create your schedule [here](https://my.home-assistant.io/redirect/helpers/).
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - schedule
                    - binary_sensor
              multiple: false

    frost_protection:
      name: Frost Protection
      icon: mdi:snowflake-alert
      collapsed: true
      input:
        frost_protection_duration:
          name: ⏱️ Frost Protection Duration
          description: Duration for which all persons (and guest mode) must be away before activating frost protection mode
          default:
            days: 1
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: true

        frost_protection_datetime_helper:
          name: ❄️ Frost Protection DateTime Helper (Optional)
          description: |
            `optional` `recommended for frost protection`

            Input datetime that tracks when frost protection should activate.
            Serves dual purpose: scheduling activation time AND tracking active state.
            Ensures frost protection works correctly across HA restarts.

            If not configured, automatic frost protection is disabled (manual override still works).

            **It also needs person entities or guest mode.** Automatic frost
            protection asks whether the house is empty, and with no presence
            input configured there is nothing to answer that, so it never
            activates -- the manual override remains the only way in. A room
            sensor alone does not count: an empty room is not an empty house.

            Create your helper [here](https://my.home-assistant.io/redirect/helpers/).
          default: []
          selector:
            entity:
              filter:
                - domain: input_datetime
              multiple: false

    window_detection:
      name: Window & Door Detection
      icon: mdi:window-open
      collapsed: true
      input:
        window_sensors:
          name: 🪟 Window/Door Sensors
          description: Binary sensors for windows/doors (on/open = heating turns off)
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class:
                    - window
                    - door
                    - opening
              multiple: true

        window_open_duration:
          name: ⏱️ Window Open Duration
          description: Duration for which window must be open before reducing heating
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
              enable_day: false

        window_close_duration:
          name: ⏱️ Window Close Duration
          description: Duration for which window must be closed before restoring heating
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
              enable_day: false

    manual_overrides:
      name: Manual Overrides
      icon: mdi:hand-back-right
      collapsed: true
      input:
        heating_off_override:
          name: 🛑 Heating Off Override
          description: Any of these ON turns off all heating (sets HVAC mode to off). Takes effect whatever the schedule, presence or frost protection state.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - switch
                    - binary_sensor
              multiple: true

        frost_protection_override:
          name: ❄️ Manual Frost Protection Override
          description: Toggle to manually activate frost protection mode (uses frost protection temperature). Complements automatic frost protection.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - switch
                    - binary_sensor
              multiple: false

    manual_changes:
      name: Manual Changes
      icon: mdi:knob
      collapsed: true
      input:
        manual_hold_duration:
          name: ⏱️ Manual Change Hold Duration
          description: >-
            How long a thermostat changed by hand -- on the device or in its
            vendor app -- keeps that setting before the automation takes over
            again. Any change to an input (schedule, presence, window,
            override) ends the hold earlier. Needs the helper below: without
            it, the hold lasts until that next input change or a restart, and
            only 0 versus not 0 matters here. Set it to 0 to put a manual
            change back straight away. Never applies while the
            heating is forced off or in frost protection: those put the
            thermostat back regardless.
          default:
            hours: 2
            minutes: 0
            seconds: 0
          selector:
            duration:
              enable_day: false

        manual_hold_datetime_helper:
          name: ⏱️ Manual Change DateTime Helper (Optional)
          description: |
            `optional`

            Input datetime (date and time) recording when a manual change
            hold ends, so the hold survives a Home Assistant restart and
            expires after the hold duration. Without it, a hold lasts until
            the next input change, and a restart ends it.

            Create your helper [here](https://my.home-assistant.io/redirect/helpers/).
          default: []
          selector:
            entity:
              filter:
                - domain: input_datetime
              multiple: false

    status:
      name: Status
      icon: mdi:eye
      collapsed: true
      input:
        status_entity:
          name: 📊 Status Entity
          description: >-
            Optional input_select updated with the mode the thermostats have
            actually taken, for dashboards. Create it with exactly these
            options, in any order: Comfort, Comfort Boosted, Eco, Away, Frost
            Protection, Window Open, Off, Manual. Capitalisation matters.

            Written only once every reachable thermostat agrees with the
            target, so it lags a change by the integration's polling delay, and
            holds its previous value while a thermostat cannot be commanded --
            stale rather than wrong. An option that does not exist is not
            written either, and the helper keeps its previous value.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - input_select
              multiple: false

variables:
  # Thermostats & Temperatures
  climate_target: !input climate_target
  comfort_temp: !input comfort_temperature
  eco_temp: !input eco_temperature
  boost_temp_offset: !input boost_temperature_offset
  away_temp_offset: !input away_temperature_offset
  frost_temp: !input frost_protection_temperature

  # Preset Modes
  use_preset_modes: !input use_preset_modes
  comfort_preset: !input comfort_preset
  eco_preset: !input eco_preset
  boost_preset: !input boost_preset
  away_preset: !input away_preset
  frost_protection_preset: !input frost_protection_preset

  # Schedule
  schedule_entity: !input schedule_entity

  # Presence Detection
  presence_persons: !input presence_persons
  guest_mode: !input guest_mode
  presence_sensor: !input presence_sensor

  # Boost
  boost_schedule_entity: !input boost_schedule_entity

  # Frost Protection
  frost_protection_duration: !input frost_protection_duration
  frost_protection_datetime_helper: !input frost_protection_datetime_helper

  # Window Detection
  window_sensors: !input window_sensors

  # Manual Overrides
  heating_off_override: !input heating_off_override
  frost_protection_override: !input frost_protection_override

  # Manual Changes
  manual_hold_duration: !input manual_hold_duration
  manual_hold_datetime_helper: !input manual_hold_datetime_helper

  # Status
  status_entity: !input status_entity

  # A manual "Run actions" supplies a trigger with no id
  trigger_id: "{{ trigger.id | default('', true) }}"

  # A thermostat reporting its own state. Either it caught up with a command or
  # someone changed it; neither is a reason to send commands, so these runs only
  # read back.
  climate_report: >-
    {{ trigger_id in ['climate_setpoint_changed', 'climate_preset_changed', 'climate_mode_changed'] }}

  manual_hold_seconds: "{{ timedelta(**manual_hold_duration).total_seconds() }}"

  # An offset of 0 means "use eco" rather than "same as comfort"
  away_temp: >-
    {% if away_temp_offset == 0 %}
      {{ eco_temp }}
    {% else %}
      {{ comfort_temp + away_temp_offset }}
    {% endif %}

  guest_mode_active: >-
    {{ guest_mode | length > 0 and is_state(guest_mode, 'on') }}

  heating_off_override_active: >-
    {{ expand(heating_off_override) | selectattr('state', 'eq', 'on') | list | count > 0 }}

  frost_protection_override_active: >-
    {{ frost_protection_override | length > 0 and is_state(frost_protection_override, 'on') }}

  presence_sensor_active: >-
    {{ presence_sensor | length > 0 and is_state(presence_sensor, 'on') }}

  any_person_home: >-
    {{ presence_persons | length > 0 and expand(presence_persons) | selectattr('state', 'eq', 'home') | list | count > 0 }}

  # Guest mode counts as a person. When a room sensor is configured as well,
  # both must agree, so heating follows the room rather than the house.
  presence_detected: >-
    {% set anyone_home = any_person_home or guest_mode_active %}
    {% if presence_sensor | length > 0 and (presence_persons | length > 0 or guest_mode | length > 0) %}
      {{ presence_sensor_active and anyone_home }}
    {% elif presence_sensor | length > 0 %}
      {{ presence_sensor_active }}
    {% elif presence_persons | length > 0 or guest_mode | length > 0 %}
      {{ anyone_home }}
    {% else %}
      {{ true }}
    {% endif %}

  # Frost protection asks whether the house is empty, which only has an answer
  # when presence is configured. presence_detected assumes someone is in when
  # nothing is configured, so this has to agree: otherwise a room with no
  # presence sources arms a countdown that person_returned/guest_arrived can
  # never clear, because neither trigger has an entity to fire on. The room
  # sensor is deliberately not consulted -- an empty house is not the same as
  # an empty room.
  house_empty: >-
    {{ (presence_persons | length > 0 or guest_mode | length > 0)
       and not (any_person_home or guest_mode_active) }}

  schedule_active: >-
    {{ schedule_entity | length > 0 and is_state(schedule_entity, 'on') }}

  boost_active: >-
    {{ boost_schedule_entity | length > 0 and is_state(boost_schedule_entity, 'on') }}

  # Only ever selected in the "present and comfort" branches, which is what
  # confines boost to comfort periods
  comfort_temp_boosted: >-
    {% if boost_active %}
      {{ comfort_temp + boost_temp_offset }}
    {% else %}
      {{ comfort_temp }}
    {% endif %}

  comfort_preset_boosted: >-
    {% if boost_active %}
      {{ boost_preset }}
    {% else %}
      {{ comfort_preset }}
    {% endif %}

  window_open: >-
    {{ window_sensors | length > 0 and expand(window_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}

triggers:
  - trigger: homeassistant
    event: start
    id: ha_start

  # for: holds as long as the entity does not go back to the from-state, so an
  # ordinary state change during the wait does not cancel it (see the state
  # trigger's _check_same_state: with from: and no to:, the test is
  # "still not unavailable"). A flapping cloud integration therefore never
  # fires this, while a real recovery fires once the entity has settled.
  - trigger: state
    entity_id: !input climate_target
    from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    for: !input climate_available_duration
    id: climate_available

  # A thermostat catching up with a command, so the status helper is written
  # without waiting on an unrelated trigger, or someone changing it by hand.
  # Scoped to these attributes, not a bare state trigger, to skip
  # current_temperature (room temp) churn.
  - trigger: state
    entity_id: !input climate_target
    attribute: temperature
    id: climate_setpoint_changed

  - trigger: state
    entity_id: !input climate_target
    attribute: preset_mode
    id: climate_preset_changed

  # not_from/not_to also make it ignore attribute-only changes, which the two
  # triggers above cover; returning from unavailable is climate_available's job
  - trigger: state
    entity_id: !input climate_target
    not_from:
      - unavailable
      - unknown
    not_to:
      - unavailable
      - unknown
    id: climate_mode_changed

  # not_to rather than to: "not_home", so leaving for a named zone ("Work")
  # counts as leaving
  - trigger: state
    entity_id: !input presence_persons
    not_to: home
    for: !input person_away_duration
    id: presence_away

  - trigger: state
    entity_id: !input presence_persons
    to: home
    for: !input person_home_duration
    id: presence_home

  - trigger: state
    entity_id: !input presence_sensor
    to: "off"
    for: !input person_away_duration
    id: presence_sensor_away

  - trigger: state
    entity_id: !input presence_sensor
    to: "on"
    for: !input person_home_duration
    id: presence_sensor_home

  - trigger: state
    entity_id: !input guest_mode
    id: guest_mode_change

  - trigger: state
    entity_id: !input heating_off_override
    id: heating_off_override_change

  - trigger: state
    entity_id: !input frost_protection_override
    id: frost_protection_override_change

  - trigger: state
    entity_id: !input schedule_entity
    id: schedule_change

  - trigger: state
    entity_id: !input boost_schedule_entity
    id: boost_schedule_change

  - trigger: state
    entity_id: !input window_sensors
    to: "on"
    for: !input window_open_duration
    id: window_opened

  - trigger: state
    entity_id: !input window_sensors
    to: "off"
    for: !input window_close_duration
    id: window_closed

  # Schedules frost protection. from: home rather than to: "not_home" so that
  # leaving for a named zone counts, and so that moving between zones while
  # away does not push the scheduled time back.
  - trigger: state
    entity_id: !input presence_persons
    from: home
    id: person_left

  - trigger: state
    entity_id: !input presence_persons
    to: home
    id: person_returned

  - trigger: state
    entity_id: !input guest_mode
    to: "off"
    id: guest_left

  - trigger: state
    entity_id: !input guest_mode
    to: "on"
    id: guest_arrived

  - trigger: time
    at: !input frost_protection_datetime_helper
    id: frost_protection_time_reached

  - trigger: time
    at: !input manual_hold_datetime_helper
    id: manual_hold_expired

actions:
  # The datetime helper is both the countdown and the "active" flag: a time in
  # the past means active, the epoch means nothing is scheduled.
  - if:
      - "{{ trigger_id in ['person_left', 'guest_left'] and frost_protection_datetime_helper | length > 0 }}"
      - "{{ house_empty }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ frost_protection_datetime_helper }}"
        data:
          datetime: "{{ (now() + timedelta(**frost_protection_duration)).strftime('%Y-%m-%d %H:%M:%S') }}"

  - if:
      - "{{ trigger_id in ['person_returned', 'guest_arrived'] and frost_protection_datetime_helper | length > 0 }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ frost_protection_datetime_helper }}"
        data:
          datetime: "1970-01-01 00:00:00"

  # Turning the override off while away restarts the countdown instead of
  # clearing it, so remote pre-heating cannot leave an empty house heated
  - if:
      - >-
        {{ trigger_id == 'frost_protection_override_change'
           and frost_protection_datetime_helper | length > 0
           and not frost_protection_override_active }}
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ frost_protection_datetime_helper }}"
        data:
          datetime: >-
            {% if house_empty %}
              {{ (now() + timedelta(**frost_protection_duration)).strftime('%Y-%m-%d %H:%M:%S') }}
            {% else %}
              1970-01-01 00:00:00
            {% endif %}

  # Any input change ends a hold. A restart, a reconnect and the thermostats'
  # own reports do not, or a hold would end at the next poll.
  - if:
      - >-
        {{ manual_hold_datetime_helper | length > 0
           and not climate_report
           and trigger_id not in ['ha_start', 'climate_available']
           and states(manual_hold_datetime_helper) != '1970-01-01 00:00:00' }}
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ manual_hold_datetime_helper }}"
        data:
          datetime: "1970-01-01 00:00:00"

  # Rendered here rather than in the top-level variables so that it sees the
  # helpers as written by the steps above
  - variables:
      frost_protection_active: >-
        {% set scheduled_dt = states(frost_protection_datetime_helper) | as_datetime if frost_protection_datetime_helper | length > 0 else none %}
        {% if scheduled_dt is not none %}
          {% set scheduled_dt = scheduled_dt | as_local %}
          {% set epoch_dt = '1970-01-01 00:00:00' | as_datetime | as_local %}
          {{ frost_protection_override_active or (scheduled_dt > epoch_dt and scheduled_dt <= now()) }}
        {% else %}
          {{ frost_protection_override_active }}
        {% endif %}

      target_temp: >-
        {% if frost_protection_active %}
          {{ frost_temp }}
        {% elif schedule_active and presence_detected %}
          {{ comfort_temp_boosted }}
        {% elif schedule_active %}
          {{ away_temp }}
        {% elif schedule_entity | length == 0 and presence_detected %}
          {{ comfort_temp_boosted }}
        {% else %}
          {{ eco_temp }}
        {% endif %}

      target_preset: >-
        {% if frost_protection_active %}
          {{ frost_protection_preset }}
        {% elif schedule_active and presence_detected %}
          {{ comfort_preset_boosted }}
        {% elif schedule_active %}
          {{ away_preset }}
        {% elif schedule_entity | length == 0 and presence_detected %}
          {{ comfort_preset_boosted }}
        {% else %}
          {{ eco_preset }}
        {% endif %}

      target_hvac_mode: >-
        {% if heating_off_override_active or window_open %}
          off
        {% else %}
          heat
        {% endif %}

      # Branch order has to stay identical to target_temp, with the two
      # hvac-off cases from target_hvac_mode in front: a status that disagrees
      # with what was commanded is worse than no status at all
      target_mode: >-
        {% if heating_off_override_active %}
          Off
        {% elif window_open %}
          Window Open
        {% elif frost_protection_active %}
          Frost Protection
        {% elif schedule_active and presence_detected %}
          {{ 'Comfort Boosted' if boost_active else 'Comfort' }}
        {% elif schedule_active %}
          Away
        {% elif schedule_entity | length == 0 and presence_detected %}
          {{ 'Comfort Boosted' if boost_active else 'Comfort' }}
        {% else %}
          Eco
        {% endif %}

      # Forced off and frost protection always win over a hand on the dial
      hold_allowed: "{{ target_hvac_mode == 'heat' and not frost_protection_active }}"

      manual_hold_active: >-
        {% set until = states(manual_hold_datetime_helper) | as_datetime if manual_hold_datetime_helper | length > 0 else none %}
        {{ hold_allowed and until is not none and (until | as_local) > now() }}

      # The automation's own commands come back tagged with the run's context,
      # so a report with no parent context came from the device, its vendor
      # app or the Home Assistant UI. Home Assistant keeps that tag for only a
      # few seconds after a command, so a slower integration's catch-up arrives
      # untagged: agreeing with the target is what keeps it from counting.
      manual_change: >-
        {% if climate_report and trigger.to_state.context.parent_id is none and has_value(trigger.entity_id) %}
          {% set entity = trigger.entity_id %}
          {% if states(entity) != target_hvac_mode %}
            {{ true }}
          {% elif target_hvac_mode == 'off' %}
            {{ false }}
          {% elif use_preset_modes %}
            {% set presets = state_attr(entity, 'preset_modes') or [] %}
            {{ target_preset in presets and state_attr(entity, 'preset_mode') != target_preset }}
          {% else %}
            {{ (target_temp | float - (state_attr(entity, 'temperature') | float(0))) | abs > 0.1 }}
          {% endif %}
        {% else %}
          {{ false }}
        {% endif %}

      hold_manual_change: "{{ manual_change and hold_allowed and manual_hold_seconds > 0 }}"

      # A manual change that cannot be held falls through to the commands below,
      # which put the thermostat back
      skip_commands: >-
        {{ (climate_report and not manual_change)
           or (trigger_id in ['ha_start', 'climate_available'] and manual_hold_active) }}

  - if:
      - "{{ hold_manual_change }}"
    then:
      - if:
          - "{{ manual_hold_datetime_helper | length > 0 }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: "{{ manual_hold_datetime_helper }}"
            data:
              datetime: "{{ (now() + timedelta(seconds=manual_hold_seconds | float)).strftime('%Y-%m-%d %H:%M:%S') }}"
      - if:
          - "{{ status_entity | length > 0 and states(status_entity) != 'Manual' }}"
        then:
          - action: input_select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ status_entity }}"
            data:
              option: Manual
      - stop: Manual change held

  # Looped per entity rather than passing climate_target straight to the
  # actions: each entity's current state is compared before commanding it, so
  # a steady state sends nothing to cloud-backed integrations
  - repeat:
      for_each: "{{ climate_target }}"
      sequence:
        # An if rather than a bare condition: a failing condition would end the
        # whole loop and skip every entity after this one
        - if:
            - "{{ not skip_commands }}"
            - "{{ has_value(repeat.item) }}"
          then:
            - variables:
                current_temp: "{{ state_attr(repeat.item, 'temperature') | float(0) }}"
                current_preset: "{{ state_attr(repeat.item, 'preset_mode') }}"
                # state_attr returns None, which default() would not replace
                supported_presets: "{{ state_attr(repeat.item, 'preset_modes') or [] }}"

            - if:
                - "{{ states(repeat.item) != target_hvac_mode }}"
              then:
                - action: climate.set_hvac_mode
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    hvac_mode: "{{ target_hvac_mode }}"

            - if:
                - "{{ target_hvac_mode != 'off' }}"
              then:
                - if:
                    - "{{ use_preset_modes }}"
                  then:
                    - if:
                        - "{{ target_preset in supported_presets and current_preset != target_preset }}"
                      then:
                        - action: climate.set_preset_mode
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            preset_mode: "{{ target_preset }}"
                  else:
                    # 0.1°C tolerance absorbs float noise in the reported setpoint
                    - if:
                        - "{{ (target_temp | float - current_temp) | abs > 0.1 }}"
                      then:
                        - action: climate.set_temperature
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            temperature: "{{ target_temp | float }}"

  # Read back rather than trusting the commands above. continue_on_error hides
  # a rejected call -- a cloud API refusing on quota is the observed case -- and
  # Home Assistant offers no way to see that from inside the script, so the only
  # evidence a command landed is the entity agreeing with the target. The
  # comparisons below must mirror the commands: same skip of unavailable
  # entities, same preset-or-temperature split, same 0.1 tolerance.
  - variables:
      status_confirmed: >-
        {% set ns = namespace(available=0, mismatched=0) %}
        {% for entity in climate_target if has_value(entity) %}
          {% set ns.available = ns.available + 1 %}
          {% if states(entity) != target_hvac_mode %}
            {% set ns.mismatched = ns.mismatched + 1 %}
          {% elif target_hvac_mode != 'off' %}
            {% if use_preset_modes %}
              {% set presets = state_attr(entity, 'preset_modes') or [] %}
              {% if target_preset in presets and state_attr(entity, 'preset_mode') != target_preset %}
                {% set ns.mismatched = ns.mismatched + 1 %}
              {% endif %}
            {% elif (target_temp | float - (state_attr(entity, 'temperature') | float(0))) | abs > 0.1 %}
              {% set ns.mismatched = ns.mismatched + 1 %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.available > 0 and ns.mismatched == 0 }}

  # Only once the thermostats agree, so a rejected command leaves the helper on
  # its previous value: stale, but never claiming a mode the heating never took.
  # A run that commanded a change reads back stale; the thermostats' reports
  # re-run this check once they catch up.
  - if:
      - >-
        {{ status_entity | length > 0 and status_confirmed
           and states(status_entity) != target_mode }}
    then:
      - action: input_select.select_option
        # An option missing from the helper must not stop the run; the heating
        # is already commanded by this point either way
        continue_on_error: true
        target:
          entity_id: "{{ status_entity }}"
        data:
          option: "{{ target_mode }}"

# Several thermostats in one room report a command back within milliseconds of
# each other. Those runs send nothing, but each must read back, or the last one
# to catch up never confirms the status.
mode: queued
